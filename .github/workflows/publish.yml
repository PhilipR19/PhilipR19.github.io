name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"   # monthly rebuild so new publications appear

permissions:
  contents: write   # to commit the accumulated abstract cache back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh publications from OpenAlex (non-fatal)
        run: python scripts/fetch_publications.py || echo "OpenAlex fetch failed; using committed snapshot"
      - name: Rebuild research-themes word cloud (non-fatal)
        run: python scripts/wordcloud.py || echo "word cloud build failed; using committed snapshot"
      - name: Refresh Google Scholar metrics (non-fatal)
        run: python scripts/scholar_metrics.py || echo "Scholar metrics failed; using committed snapshot"
      - name: Persist accumulated abstract cache (non-fatal)
        run: |
          if ! git diff --quiet -- _abstracts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _abstracts.json
            git commit -m "chore: accumulate abstract cache [skip ci]"
            git push
          fi
        continue-on-error: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: quarto-dev/quarto-actions/render@v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
